      <h1>Iceland</h1>
      <p class="lead">
        In late summer 2026 I travelled around Iceland: waterfalls, black-sand beaches,
        glaciers and a lot of wind. Here are some of my favorite photos from the trip.
      </p>

      <ul class="gallery">

          </figure>
        </li>
        <li class="gallery-item">
